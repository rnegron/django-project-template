name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  DJANGO_SECRET_KEY: "super-secret-ci-key"
  REDIS_HOST: "localhost"
  DATABASE_URL: "postgres://postgres:password@localhost:5432/postgres"



jobs:
 test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.8-bookworm
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13.3
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.3

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential curl gettext git google-chrome-stable

      - name: Install Python Dependencies
        run: uv sync

      - name: Ensure browsers are installed
        run: uv run python -m playwright install --with-deps

      - name: Install Tailwind
        run: uv run python manage.py tailwind install --no-input

      - name: Build Tailwind
        run: uv run python manage.py tailwind build --no-input

      - name: Collect static files
        run: uv run python manage.py collectstatic --noinput

      - name: Run migrations
        run: uv run python manage.py migrate

      - name: Test with pytest (coverage)
        run: uv run pytest --cov={{project_name}}  --cov-config=.coveragerc --cov-fail-under=85  --cov-report term-missing:skip-covered

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13.3
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.3

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential curl gettext git

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
