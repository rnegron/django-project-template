repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        language_version: python3.13
        args: [--ignore-missing-imports, --disallow-untyped-defs]
        exclude: ^(tests/|migrations/)
        additional_dependencies:
          - celery
          - dj-database-url
          - django-allauth
          - django-browser-reload
          - django-celery-beat
          - django-debug-toolbar
          - django-filter
          - django-htmx
          - django-model-utils
          - django-stubs==6.0.5
          - django-tailwind
          - Django
          - djangorestframework-stubs==3.17.0
          - djangorestframework
          - gunicorn
          - psycopg[binary]
          - python-dotenv
          - requests
          - sentry-sdk
          - whitenoise

  - repo: local
    hooks:
      - id: django-check
        name: django check
        entry: uv run python manage.py check
        language: system
        pass_filenames: false
        always_run: true

      - id: django-check-migrations
        name: django check migrations
        entry: uv run python manage.py makemigrations --check --dry-run --no-input
        language: system
        pass_filenames: false
        files: models\.py$

      - id: commitizen-check
        name: commitizen check
        entry: uv run cz check --commit-msg-file
        language: system
        stages: [commit-msg]
