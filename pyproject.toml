[project]
name = "{{ project_name }}"
version = "1.0.0"
description = ""
authors = [{ name = "YOUR NAME HERE"}]
requires-python = "==3.13.8"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "Django>=4.2.11,<4.3.0",
    "djangorestframework>=3.15.1,<3.16.0",
    "django-model-utils>=4.5.0,<4.6.0",
    "django-extensions>=3.2.3,<3.3.0",
    "dj-database-url>=2.1.0,<2.2.0",
    "psycopg2>=2.9.9,<2.10.0",
    "django-filter>=23.5.0,<23.6.0",
    "gunicorn>=22.0.0,<22.1.0",
    "python-dotenv>=1.0.1,<1.1.0",
    "django-allauth>=0.61.1,<0.62.0",
    "sentry-sdk>=1.45.0,<1.46.0",
    "whitenoise>=6.6.0,<6.7.0",
    "celery>=5.4.0,<5.5.0",
    "django-celery-beat>=2.6.0,<2.7.0",
    "requests>=2.31.0,<2.32.0",
    "redis>=5.0.3,<5.1.0",
    "django-htmx>=1.17.3,<1.18.0",
    "django-tailwind>=4.3.0,<5.0.0",
    "django-browser-reload>=1.12.1,<1.13.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.9.1",
    "django-debug-toolbar==4.3.0",
    "django-stubs==4.2.7",
    "djangorestframework-stubs==3.14.5",
    "factory-boy==3.3.0",
    "mypy==1.7.1",
    "pre-commit==3.4.0",
    "pytest==8.1.1",
    "pytest-django==4.8.0",
    "pytest-cov==7.0.0",
    "ruff==0.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = '3.13'
warn_return_any = "True"
warn_unused_configs = "True"
warn_no_return = "True"
warn_redundant_casts = "True"
disallow_untyped_defs = "True"
no_implicit_optional = "True"
check_untyped_defs = "True"
exclude = [
    "migrations/*",
]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".venv",
    "_build",
    "build",
    "dist",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "DJ001", # avoid using null=True on string-based fields
]

[tool.ruff.lint.isort]
known-first-party = ["{{ project_name }}"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
tag_format = "v$version"
